name: Build CameraAccess APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'samples/CameraAccess/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build CameraAccess
        working-directory: samples/CameraAccess
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-debug-apk
          path: samples/CameraAccess/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
